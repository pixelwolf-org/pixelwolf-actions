name: Web Preview Branches CI/CD
description: A CI/CD that runs on Stage for Feature previews branches.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  stage-ci-cd:
    uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-preview-ci-cd.yml@main
    secrets: inherit