name: Web Stage CI/CD
description: A CI/CD workflow for staging and feature preview environments

on:
  pull_request:
    types: [opened, synchronize, reopened]
  
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  stage-ci-cd:
    uses: pixelwolf-org/pixelwolf-actions/workflows/web-stage-ci-cd@main