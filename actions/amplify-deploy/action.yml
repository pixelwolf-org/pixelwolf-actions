name: 'AWS Amplify Deploy'
description: 'Deploy to AWS Amplify'

inputs:
  app-id:
    description: 'Amplify app ID'
    required: true
  branch-name:
    description: 'Branch name to deploy'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
  role-arn:
    description: 'AWS OIDC Role ARN'
    required: true
  create-branch:
    description: "Create branch if it doesn't exist"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Install AWS Amplify CLI
      shell: bash
      run: |
        npm install -g @aws-amplify/cli

    - name: Create AWS Amplify Feature Branch
      if: ${{ inputs.create-branch == 'true' }}
      shell: bash
      run: |
        aws amplify create-branch --app-id ${{ inputs.app-id }} \
            --branch-name ${{ inputs.branch-name }} \
            --no-enable-auto-build \
            --enable-pull-request-preview || true
    - name: Deploy to AWS Amplify
      shell: bash
      run: |
        aws amplify start-job --app-id ${{ inputs.app-id }} \
            --branch-name ${{ inputs.branch-name }} \
            --job-type RELEASE

branding:
  icon: 'upload-cloud'
  color: 'orange'
