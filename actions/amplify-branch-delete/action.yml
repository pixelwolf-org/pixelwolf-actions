name: "AWS Amplify Branch Delete"
description: "Delete an AWS Amplify Branch"

inputs:
  app-id:
    description: "Amplify app ID"
    required: true
  branch-name:
    description: "Branch name to delete"
    required: true
  aws-region:
    description: "AWS Region"
    required: true
  role-arn:
    description: "AWS OIDC Role ARN"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Install AWS Amplify CLI
      shell: bash
      run: |
        npm install -g @aws-amplify/cli

    - name: Delete Branch
      shell: bash
      run: |
        aws amplify delete-branch --app-id ${{ inputs.app-id }} \
            --branch-name ${{ inputs.branch-name }}

branding:
  icon: "upload-cloud"
  color: "purple"
