name: 'S3 to Environment Variables'
description: 'Downloads an environment file from S3 and exports variables for use in subsequent steps'

inputs:
  env-s3-path:
    description: 'Path to the environment file in S3 bucket'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download environment file from S3
      run: |
        echo "Downloading environment file from ${{ inputs.env-s3-path }}"
        aws s3 cp ${{ inputs.env-s3-path }} .env.downloaded
      shell: bash

    - name: Export environment variables
      run: |
        echo "Exporting environment variables from downloaded file"
        while IFS= read -r line || [[ -n "$line" ]]; do
          # Skip empty lines and comments
          if [[ -z "$line" || "$line" =~ ^# ]]; then
            continue
          fi
          
          # Remove any trailing comments
          line=$(echo "$line" | sed 's/#.*$//')
          
          # Trim whitespace
          line=$(echo "$line" | xargs)
          
          # Skip if line is empty after trimming
          if [[ -z "$line" ]]; then
            continue
          fi
          
          # Export the variable
          echo "$line" >> $GITHUB_ENV
          
          # Print variable name (not value for security)
          var_name=$(echo "$line" | cut -d= -f1)
          echo "Exported: $var_name"
        done < .env.downloaded
      shell: bash

    - name: Clean up
      run: rm -f .env.downloaded
      shell: bash
