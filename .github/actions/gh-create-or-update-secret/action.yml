name: 'Create or Update Repository Secret'
description: 'A GitHub Action to create or update repository or organization secrets (Actions/Dependabot) via the GitHub API'
author: 'Pixelwolf <engineering@pixelwolf.com.br>'

inputs:
  secret-name:
    description: 'Name of the secret to create or update. Must follow GitHub naming conventions.'
    required: true
  secret-value:
    description: 'Value to encrypt and store in the secret. Will be automatically encrypted using GitHub public key.'
    required: true
  scope:
    description: 'Target scope for the secret. Must be either "repository" (for repo-level secrets) or "organization" (for org-level secrets).'
    required: true
    default: 'repository'
  secret-type:
    description: 'Type of secret to create/update. Must be either "actions" (for GitHub Actions secrets) or "dependabot" (for Dependabot secrets).'
    required: true
    default: 'actions'
  github-token:
    description: 'GitHub token with required permissions. For repository secrets, needs repo scope. For organization secrets, needs admin:org scope.'
    required: true

runs:
  using: 'node20'
  main: 'action/index.js'