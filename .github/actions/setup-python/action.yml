name: 'Setup Python Environment'
description: 'Sets up Python and Poetry or uv with optional caching for dependencies.'

inputs:
  python-version:
    description: "Python version to install. Example: '3.12'"
    required: true
  package-manager:
    description: "Package manager to use. Options: 'poetry', 'uv'."
    default: 'poetry'
    required: false
  uv-version:
    description: 'uv version to install. Leave empty to install the latest version.'
    required: false
  poetry-version:
    description: 'Poetry version to install. Leave empty to install the latest version.'
    required: false
  use-cache:
    description: 'Enable caching for Poetry/uv and pip dependencies.'
    default: 'true'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      if: ${{ inputs.package-manager == 'poetry' }}
      shell: bash
      run: |
        if [[ -n "${{ inputs.poetry-version }}" ]]; then
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=${{ inputs.poetry-version }} python3 -
        else
          curl -sSL https://install.python-poetry.org | python3 -
        fi
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "Poetry installed"

    # Installed with the official script instead of `astral-sh/setup-uv`: repositories that only allow actions owned
    # by pixelwolf-org or GitHub (e.g., pixelwolf-iac) fail at "Set up job" when a composite action references a
    # third-party action, even in a step that is skipped.
    - name: Install uv
      if: ${{ inputs.package-manager == 'uv' }}
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
        UV_NO_MODIFY_PATH: '1'
      run: |
        if [[ -n "$UV_VERSION" ]]; then
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
        else
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/uv" --version

    - name: Set up Poetry cache (if enabled)
      if: ${{ inputs.use-cache == 'true' && inputs.package-manager == 'poetry' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ runner.os }}-python-${{ inputs.python-version }}-poetry-${{ inputs.poetry-version }}-cache-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-poetry-${{ inputs.poetry-version }}-cache-

    - name: Set up uv cache (if enabled)
      if: ${{ inputs.use-cache == 'true' && inputs.package-manager == 'uv' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
        key: ${{ runner.os }}-python-${{ inputs.python-version }}-uv-${{ inputs.uv-version }}-cache-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-uv-${{ inputs.uv-version }}-cache-
