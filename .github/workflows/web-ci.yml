name: 'Web CI Workflow'
description: 'CI workflow for web app using Bun for faster builds'

on:
  workflow_call:
    inputs:
      should-run-unit-tests:
        description: 'Should run unit tests'
        required: false
        default: 'true'
        type: string
      should-run-e2e-tests:
        description: 'Should run E2E tests'
        required: false
        default: 'false'
        type: string
      env-file-path:
        description: 'Path to the environment file'
        required: false
        default: '.env.production'
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup aws credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: someimportantcompany/github-actions-aws-s3-env@v1
        with:
          from: s3://pixelwolf/${{ inputs.env-file-path }}

      - name: 'Log environment variables'
        run: |
          echo "Environment variables loaded from S3:"
          env | sort
        shell: bash

      - name: 'Setup Bun'
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/setup-bun@main
        with:
          github-token: ${{ github.token }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile
        shell: bash

      - name: 'Run format (Prettier) check'
        run: bun run format-check

      - name: 'Lint'
        run: bun run lint

      - name: 'Build web app'
        run: bun run build:ci

      - name: 'Run unit tests'
        if: ${{ inputs.should-run-unit-tests == 'true' }}
        run: bun run test

      - name: 'Install Playwright Chromium browser'
        if: ${{ inputs.should-run-e2e-tests == 'true' }}
        run: bunx playwright install chromium --with-deps

      - name: 'Run Playwright tests'
        if: ${{ inputs.should-run-e2e-tests == 'true' }}
        run: bunx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.supabase-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.supabase-anon-key }}

      - name: 'Upload Playwright report'
        if: ${{ inputs.should-run-e2e-tests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
