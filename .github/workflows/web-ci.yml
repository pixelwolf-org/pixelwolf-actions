name: 'Web CI Workflow'
description: 'CI workflow for web app using Bun for faster builds'

on:
  workflow_call:
    inputs:
      should-run-unit-tests:
        description: 'Should run unit tests'
        required: false
        default: 'true'
        type: string
      should-run-e2e-tests:
        description: 'Should run E2E tests'
        required: false
        default: 'false'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: 'Setup Bun'
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/setup-bun@feature/web-ci-cd
        with:
          github-token: ${{ github.token }}
      - name: 'Install dependencies'
        run: bun install --frozen-lockfile
        shell: bash
      - name: 'Run format (Prettier) check'
        run: bun run format-check
      - name: 'Lint'
        run: bun run lint
      - name: 'Build web app'
        run: bun run build:ci

  unit-tests:
    needs: build
    if: ${{ inputs.should-run-unit-tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Setup Bun'
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/setup-bun@feature/web-ci-cd
        with:
          github-token: ${{ github.token }}
      - name: 'Install dependencies'
        run: bun install --frozen-lockfile
      - name: 'Run unit tests'
        run: bun run test

  e2e-tests:
    needs: build
    if: ${{ inputs.should-run-e2e-tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Setup Bun'
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/setup-bun@feature/web-ci-cd
        with:
          github-token: ${{ github.token }}
      - name: 'Install dependencies'
        run: bun install --frozen-lockfile
      - name: 'Install Playwright Chromium browser'
        run: bunx playwright install chromium --with-deps
      - name: 'Run Playwright tests'
        run: bunx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.supabase-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.supabase-anon-key }}
      - name: 'Upload Playwright report'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
