name: 'Web CI Workflow'

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: 'Install dependencies'
        run: npm install

      - name: 'Format code'
        run: npm run format

      - name: 'Lint'
        run: npm run lint

      - name: 'Build'
        run: npm run build

        