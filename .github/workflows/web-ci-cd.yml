name: 'Production CI/CD'
description: 'A CI/CD that should run whenever a pull request to main is closed'

on:
  workflow_call:
    inputs:
      org-id:
        description: 'Vercel Organization ID'
        required: true
        type: string
      project-id:
        description: 'Vercel Project ID'
        required: true
        type: string
      environment:
        description: 'Environment to deploy (e.g., preview, production)'
        default: 'preview'
        type: string
        required: false
      prod:
        description: 'Should build production build'
        required: false
        default: 'false'
        type: string
      run-unit-tests:
        description: 'Should run unit tests'
        required: false
        default: 'true'
        type: string
      run-e2e-tests:
        description: 'Should run E2E tests'
        required: false
        default: 'false'
        type: string
      env-s3-path:
        description: 'Path to the environment file in S3 bucket'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read
  issues: write

jobs:
  # ci:
  #   uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-ci.yml@main
  #   with:
  #     run-unit-tests: ${{ inputs.run-unit-tests }}
  #     run-e2e-tests: ${{ inputs.run-e2e-tests }}
  #     env-s3-path: ${{ inputs.env-s3-path }}
  #   secrets: inherit

  cd:
    # needs: ci
    uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-cd.yml@main
    with:
      env-s3-path: ${{ inputs.env-s3-path }}
      org-id: ${{ inputs.org-id }}
      project-id: ${{ inputs.project-id }}
      environment: ${{ inputs.environment }}
      prod: ${{ inputs.prod }}
    secrets: inherit
