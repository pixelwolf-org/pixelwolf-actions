name: Production CI/CD
description: A CI/CD that should run whenever a pull request to main is closed

on:
  workflow_call:
    inputs:
      app-id:
        required: true
        type: string
      branch-name:
        required: false
        type: string
        description: "stage"
      aws-region:
        required: true
        type: string
        description: "AWS Region"
      role-arn:
        required: true
        type: string
        description: "AWS OIDC Role ARN"
      clean-up:
        required: false
        type: string
        description: "Flag to control if preview branches should be deleted after the deployments"
        default: 'false'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-ci.yml@feature/web-ci-cd

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      
      - name: 'Generate Token'
        id: gh-app-token
        uses: pixelwolf-org/pixelwolf-actions/actions/gh-app-token@main
        with:
          app-id: '60963877'
          installation-id: '1141682'
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Deploy to AWS Amplify
        uses: pixelwolf-org/pixelwolf-actions/actions/amplify-deploy@feature/web-ci-cd
        with:
          app-id: ${{ inputs.app-id }}
          branch-name: ${{ inputs.branch-name }}
          create-branch: ${{ inputs.branch-name != 'stage' || inputs.branch-name != 'main' }}

  clean-up:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ inputs.clean-up == 'true' }}
    steps:
      - name: Setup AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Delete Feature Amplify Branch
        uses: pixelwolf-org/pixelwolf-actions/actions/amplify-branch-delete@feature/web-ci-cd
        with:
          branch-name: ${{ github.head_ref || github.ref_name }}
          app-id: ${{ inputs.app-id }}