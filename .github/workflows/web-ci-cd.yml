name: "Production CI/CD"
description: "A CI/CD that should run whenever a pull request to main is closed"

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (e.g., preview, production)"
        default: "preview"
        type: string
        required: false
      prod:
        description: "Should build production build"
        required: false
        default: "false"
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  # ci:
  #   uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-ci.yml@feature/web-ci-cd

  cd:
    # needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Vercel Deploy"
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/vercel-deploy@main
        with:
          vercel-token: ${{ secrets.vercel-token }}
          environment: ${{ inputs.environment }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
