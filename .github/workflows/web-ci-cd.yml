name: "Production CI/CD"
description: "A CI/CD that should run whenever a pull request to main is closed"

on:
  workflow_call:
    inputs:
      app-id:
        description: "GitHub App ID"
        required: true
        type: string
      branch-name:
        description: "Branch to deploy (default: `stage`)"
        required: false
        type: string
      aws-region:
        description: "AWS Region"
        required: true
        type: string
      role-arn:
        description: "AWS OIDC Role ARN"
        required: true
        type: string
      clean-up:
        description: "Flag to control if preview branches should be deleted after the deployments"
        required: false
        type: string
        default: "false"

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  # ci:
  #   uses: pixelwolf-org/pixelwolf-actions/.github/workflows/web-ci.yml@feature/web-ci-cd

  deploy:
    # needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup AWS credentials with OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # - name: "Generate Token"
      #   id: gh-app-token
      #   uses: pixelwolf-org/pixelwolf-actions/.github/actions/gh-app-access-token@main
      #   with:
      #     app-id: "1141682"
      #     installation-id: "60963877"
      #     private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: "Update Vercel NPM RC Variable"
        run: |
          echo '@pixelwolf-org:registry=https://npm.pkg.github.com' >> .npmrc && echo '//npm.pkg.github.com/:_authToken=${{ github.token }}' >> .npmrc
          vc env add NPM_RC preview < .npmrc --force --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  clean-up:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ inputs.clean-up == 'true' }}
    steps:
      - name: "Setup AWS credentials with OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: "Delete Feature Amplify Branch"
        uses: pixelwolf-org/pixelwolf-actions/.github/actions/amplify-branch-delete@main
        with:
          branch-name: ${{ github.head_ref || github.ref_name }}
          app-id: ${{ inputs.app-id }}
